plugins {
    id 'com.android.application'
}

android {
    namespace 'com.waaqua.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.waaqua.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: '../waaqua.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'WaAqua2025'
            keyAlias System.getenv('KEY_ALIAS') ?: 'waaqua'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'WaAqua2025'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
